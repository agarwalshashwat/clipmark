name: CI Launch Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit:
    name: ci-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix webapp ci
      - run: npm run test:unit
      # webapp/tests/unit/*.test.ts — pure logic + route-handler cores. These had
      # no CI job at all; the auth-handoff and header-posture tests added in
      # docs/TEST-STRATEGY.md phase 1 live here, so gate on the whole suite.
      - run: npm run test:unit:webapp

  design-conformance:
    name: ci-design-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix webapp ci
      # Source-level DESIGN.md conformance: one gray ramp, AA filled CTAs, the
      # 11px floor, the wordmark, the gradient budget, self-hosted fonts, header
      # parity, no dangling token references, and that every stylesheet parses.
      - run: node scripts/design-audit.mjs
      # Then the same rules against the artifact that actually ships.
      - run: npm --prefix extension ci
      - run: npm run ext-build
      - run: node scripts/design-audit.mjs --dist
      # Every <script src>/<link href>/@import/url() in the SHIPPED bytes must
      # resolve. Two separate releases have gone out with a dangling reference
      # that no source-level test could see.
      - run: npm run ext:verify

  extension-smoke:
    name: ci-extension-smoke
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix webapp ci
      - run: npm --prefix extension ci
      - run: npx playwright install --with-deps chromium

      # tests/auth-bridge.spec.ts drives the PACKAGED build, the same way
      # recall-bridge.spec.ts does — dist has to exist before it runs.
      - name: Build packaged extension
        run: npm --prefix extension run build

      # Runs before the YouTube smoke on purpose: this spec never loads
      # youtube.com (route-intercepted app origin only), so it is deterministic,
      # and a network flake in the smoke step must not stop it from reporting.
      - name: Auth handoff bridge (offline)
        run: xvfb-run --auto-servernum npm run test:auth-bridge

      # design-audit.mjs checks the SOURCE and the shipped bytes; this checks what
      # the browser actually computes — the only gate that can see a token that
      # resolves wrong, a theme that never reaches <html>, or a card painted light
      # on a dark canvas. Also offline (chrome-extension:// pages only), so it runs
      # before the YouTube smoke for the same reason auth-bridge does.
      - name: Rendered DESIGN.md + theme conformance (offline)
        run: xvfb-run --auto-servernum npm run test:design:rendered

      - run: xvfb-run --auto-servernum npm run test:yt:smoke

  webapp-visual-smoke:
    name: ci-webapp-visual-smoke
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix webapp ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:webapp:smoke

  integration:
    name: ci-integration
    runs-on: ubuntu-latest
    # Local Supabase stack (Postgres + GoTrue + PostgREST) for RLS / API / webhook
    # integration tests. Kept separate from the fast gates so a Docker/stack flake
    # doesn't block them. See docs/TEST_PLAN_launch.md (enabler a).
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npm --prefix webapp ci

      - name: Start local Supabase
        run: supabase start

      - name: Export stack env for tests
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o json | jq -r .API_URL)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"

      # Reproduce the hosted platform's data grants BEFORE migrations so migration
      # 012 can refine profiles UPDATE to column-level on top of them.
      - name: Bootstrap DB grants
        working-directory: webapp
        run: npm run db:bootstrap

      - name: Apply migrations
        working-directory: webapp
        run: npx tsx scripts/migrate.ts

      - name: Reload PostgREST schema
        working-directory: webapp
        run: npm run db:reload

      - name: Seed test users
        working-directory: webapp
        run: npm run db:seed

      - name: Run integration tests
        working-directory: webapp
        run: npm run test:integration

      - name: Stop Supabase
        if: always()
        run: supabase stop
